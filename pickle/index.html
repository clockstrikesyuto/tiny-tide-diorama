<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PICKLE ROTATION</title><style>body{font-family:system-ui,sans-serif;background:#edf6f0;color:#183a2c;margin:0}main{max-width:650px;margin:auto;padding:18px}h1{text-align:center}section{background:white;padding:18px;margin:14px 0;border-radius:18px;box-shadow:0 3px 14px #0001}button,input,select{font:inherit;font-size:17px;padding:12px;border-radius:10px;border:1px solid #c4d7ca}button{background:#157451;color:white;cursor:pointer;min-height:44px;border:0}button.alt{background:#dcefe4;color:#145438}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:12px 0}.step{display:flex;align-items:center;gap:6px}.step button{padding:8px 14px}.step input{width:65px;text-align:center}input[type=number]{width:80px}.hidden{display:none}.clock{font-size:54px;text-align:center;font-weight:bold;font-variant-numeric:tabular-nums}.court{border-left:6px solid #16805d;padding:12px;background:#f1f9f4;border-radius:12px;margin:12px 0}.badge{display:inline-block;padding:6px;margin:4px;background:#e3f2e9;border-radius:8px}#notice{color:#a54a24}</style><main><h1>🏓 PICKLE ROTATION</h1><section id="lock"><h2>🔐 暗証番号</h2><form id="auth"><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="4桁" required><button>ロック解除</button></form><p id="err" role="alert"></p></section><div id="app" class="hidden"><section id="setup"><h2>人数・試合設定</h2><label class="row">🔰 初心者 <span class="step"><button type="button" data-step="b,-1" class="alt">−</button><input id="b" type="number" min="0" max="100" value="6"><button type="button" data-step="b,1" class="alt">＋</button></span></label><label class="row">🏆 経験者 <span class="step"><button type="button" data-step="e,-1" class="alt">−</button><input id="e" type="number" min="0" max="100" value="6"><button type="button" data-step="e,1" class="alt">＋</button></span></label><label class="row">コート数 <select id="courts"><option>1</option><option selected>2</option><option>3</option></select></label><label class="row">試合時間（分） <input id="mins" type="number" min="1" max="30" value="5"></label><p id="total"></p><button id="start">試合を開始</button></section><section id="game" class="hidden"><div class="row"><h2 id="round"></h2><button id="edit" class="alt">人数・設定変更</button></div><div id="clock" class="clock">05:00</div><div class="row"><button id="timer">▶ 開始</button><button id="resetTimer" class="alt">時間リセット</button></div><p id="notice" role="status"></p><div id="matches"></div><h3>🪑 待機</h3><p id="bench"></p><button id="next">🔄 次の試合へ</button><details><summary>📊 出場回数</summary><div id="stats"></div></details></section><section><button id="reset" class="alt">全データをリセット</button></section></div></main><script>(()=>{const $=id=>document.getElementById(id);const key='pickle-rotation-2026';let state={players:[],round:0,history:[],courts:2,mins:5,remain:300,playing:false,deadline:0};try{let old=JSON.parse(localStorage.getItem(key));if(old&&Array.isArray(old.players))state={...state,...old,playing:false}}catch{}function save(){localStorage.setItem(key,JSON.stringify({...state,playing:false}))}function num(x,lo,hi){let v=Number(x);return Number.isFinite(v)?Math.max(lo,Math.min(hi,Math.floor(v))):lo}function total(){let n=num($('b').value,0,100)+num($('e').value,0,100);$('total').textContent='合計 '+n+'人'}function randomize(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function find(id){return state.players.find(p=>p.id===id)}function label(id){let p=find(id);return p?(p.level==='b'?'🔰 ':'🏆 ')+id:id}function tick(){let m=Math.floor(state.remain/60),s=state.remain%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('timer').textContent=state.playing?'⏸ 一時停止':'▶ '+(state.remain?'開始・再開':'終了');$('timer').disabled=state.remain===0}function render(){total();$('setup').classList.toggle('hidden',state.round>0);$('game').classList.toggle('hidden',state.round===0);if(!state.round)return;$('round').textContent='ROUND '+state.round;let h=state.history[state.history.length-1];$('matches').innerHTML=h.matches.map((match,i)=>'<div class="court"><b>🏟️ コート'+(i+1)+'</b><p>'+match[0].map(label).join(' ＆ ')+'</p><b>VS</b><p>'+match[1].map(label).join(' ＆ ')+'</p></div>').join('');$('bench').textContent=h.bench.length?h.bench.map(label).join(' / '):'待機なし';$('stats').innerHTML=state.players.map(p=>'<span class="badge">'+label(p.id)+' '+p.games+'試合'+(p.left?'（退出）':'')+'</span>').join('');tick()}function nextRound(){let pool=randomize(state.players.filter(p=>!p.left));pool.sort((a,b)=>a.games-b.games||b.wait-a.wait);let courts=Math.min(state.courts,Math.floor(pool.length/4));let chosen=pool.slice(0,courts*4),waiting=pool.slice(courts*4),matches=[];for(let i=0;i<courts;i++){let four=chosen.splice(0,4),best=null,bestScore=-Infinity;for(let k=0;k<30;k++){let a=randomize([...four]),pairs=[[a[0],a[1]],[a[2],a[3]]],mixed=pairs.filter(p=>p[0].level!==p[1].level).length,repeat=pairs.reduce((sum,p)=>sum+state.history.filter(h=>h.matches.some(m=>m.some(q=>q.includes(p[0].id)&&q.includes(p[1].id)))).length,0),score=mixed*10-repeat*4+Math.random();if(score>bestScore){bestScore=score;best=pairs}}matches.push(best)}let selected=matches.flat(2);for(let p of state.players){if(p.left)continue;if(selected.includes(p)){p.games++;p.wait=0}else p.wait++}state.history.push({matches:matches.map(m=>m.map(pair=>pair.map(p=>p.id))),bench:waiting.map(p=>p.id)});state.round++;state.remain=state.mins*60;state.playing=false;$('notice').textContent='';save();render()}$('auth').addEventListener('submit',e=>{e.preventDefault();if($('pin').value==='1234'){$('lock').classList.add('hidden');$('app').classList.remove('hidden');$('pin').value='';render()}else{$('err').textContent='暗証番号が違います';$('pin').select()}});document.querySelectorAll('[data-step]').forEach(btn=>btn.addEventListener('click',()=>{let [id,step]=btn.dataset.step.split(',');$(id).value=num(Number($(id).value)+Number(step),0,100);total()}));$('b').addEventListener('input',total);$('e').addEventListener('input',total);$('start').onclick=()=>{let b=num($('b').value,0,100),e=num($('e').value,0,100);if(b+e<4){alert('4人以上必要です');return}state={players:[...Array(b)].map((_,i)=>({id:'B'+String(i+1).padStart(2,'0'),level:'b',games:0,wait:0})).concat([...Array(e)].map((_,i)=>({id:'E'+String(i+1).padStart(2,'0'),level:'e',games:0,wait:0}))),round:0,history:[],courts:num($('courts').value,1,3),mins:num($('mins').value,1,30),remain:300,playing:false};nextRound()};$('next').onclick=()=>{if(state.playing&&!confirm('タイマー稼働中です。次の試合へ進みますか？'))return;nextRound()};$('timer').onclick=()=>{if(state.playing){state.remain=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));state.playing=false;save()}else if(state.remain>0){state.deadline=Date.now()+state.remain*1000;state.playing=true;$('notice').textContent=''}tick()};$('resetTimer').onclick=()=>{state.playing=false;state.remain=state.mins*60;$('notice').textContent='';save();tick()};setInterval(()=>{if(!state.playing)return;state.remain=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));if(!state.remain){state.playing=false;$('notice').textContent='⏰ 試合終了！';save()}tick()},250);$('edit').onclick=()=>{state.playing=false;let values={};for(let [key,title,initial] of [['b','初心者人数',state.players.filter(p=>p.level==='b'&&!p.left).length],['e','経験者人数',state.players.filter(p=>p.level==='e'&&!p.left).length],['courts','コート数（1〜3）',state.courts],['mins','試合時間（1〜30分）',state.mins]]){let v=prompt(title,initial);if(v===null)return;values[key]=num(v,0,100)}for(let level of ['b','e']){let live=state.players.filter(p=>p.level===level&&!p.left),target=values[level];if(target<live.length)live.slice(target).forEach(p=>p.left=true);else{let next=Math.max(0,...state.players.filter(p=>p.level===level).map(p=>Number(p.id.slice(1))));for(let i=live.length;i<target;i++)state.players.push({id:level.toUpperCase()+String(++next).padStart(2,'0'),level,games:0,wait:0})}}state.courts=num(values.courts,1,3);state.mins=num(values.mins,1,30);state.remain=state.mins*60;save();render();alert('次のラウンドから新しい設定を反映します')};$('reset').onclick=()=>{if(confirm('すべての履歴を削除しますか？')){localStorage.removeItem(key);location.reload()}};total()})();</script></html>
