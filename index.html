<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#dff4ee" />
  <title>Tiny Tide — 触れる海辺の箱庭</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <style>
    :root {
      --ink:#15312b; --muted:#5d756f; --glass:rgba(255,255,255,.72);
      --line:rgba(21,49,43,.12); --shadow:0 18px 50px rgba(28,72,61,.16);
      --accent:#2d7568;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#dff4ee;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);touch-action:none}
    #app,#scene{position:fixed;inset:0}
    #scene canvas{display:block;width:100%;height:100%}
    .grain{position:fixed;inset:0;pointer-events:none;opacity:.09;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E")}
    .topbar{position:fixed;z-index:4;left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
    .brand{pointer-events:auto}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}.brand h1{margin:3px 0 0;font:700 clamp(24px,6vw,36px)/1.05 Georgia,serif;letter-spacing:-.04em}.top-actions{display:flex;gap:8px;pointer-events:auto}
    .icon-btn{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);width:44px;height:44px;border-radius:50%;box-shadow:0 8px 28px rgba(27,70,60,.10);font-size:18px;color:var(--ink)}
    .hint{position:fixed;z-index:3;left:50%;top:19%;transform:translateX(-50%);padding:9px 13px;border:1px solid rgba(255,255,255,.5);border-radius:999px;background:rgba(255,255,255,.48);backdrop-filter:blur(10px);font-size:12px;color:#46635d;white-space:nowrap;transition:.35s opacity,.35s transform;pointer-events:none}
    .hint.hide{opacity:0;transform:translate(-50%,-8px)}
    .panel{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right));top:50%;width:min(315px,calc(100vw - 32px));transform:translateY(-50%) translateX(calc(100% + 32px));padding:18px;border-radius:24px;background:rgba(250,254,252,.82);border:1px solid rgba(255,255,255,.65);backdrop-filter:blur(22px);box-shadow:var(--shadow);transition:.5s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
    .panel.open{transform:translateY(-50%) translateX(0)}
    .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}.dot{width:7px;height:7px;border-radius:50%;background:#65a997;box-shadow:0 0 0 5px rgba(101,169,151,.13)}
    .panel h2{margin:8px 0 3px;font:700 29px/1 Georgia,serif;letter-spacing:-.03em}.latin{margin:0;color:var(--muted);font-size:12px;font-style:italic}.desc{font-size:13px;line-height:1.8;color:#425c56;margin:15px 0 16px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta div{border:1px solid var(--line);border-radius:15px;padding:10px 11px;background:rgba(255,255,255,.44)}.meta b{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.meta span{font-size:12px;font-weight:700}
    .close{width:34px;height:34px;border:0;border-radius:50%;background:rgba(21,49,43,.07);font-size:18px;color:var(--ink)}
    .bottom{position:fixed;z-index:5;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,calc(100vw - 24px));padding:14px 16px 13px;border-radius:22px;background:rgba(250,254,252,.72);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(20px);box-shadow:0 14px 45px rgba(27,70,60,.13)}
    .bottom-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.bottom-title{font-size:12px;font-weight:800;letter-spacing:.03em}.tide-value{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.range-wrap{position:relative;height:26px;display:flex;align-items:center}.range-wrap:before{content:"干潮";position:absolute;left:0;top:21px;font-size:9px;color:var(--muted)}.range-wrap:after{content:"満潮";position:absolute;right:0;top:21px;font-size:9px;color:var(--muted)}
    input[type=range]{appearance:none;width:100%;height:4px;border-radius:999px;background:linear-gradient(90deg,#8bc8b9 var(--v,45%),rgba(43,102,89,.14) var(--v,45%));outline:none}input[type=range]::-webkit-slider-thumb{appearance:none;width:23px;height:23px;border-radius:50%;background:white;border:5px solid #5aa18f;box-shadow:0 3px 12px rgba(38,90,78,.25)}
    .chips{position:fixed;z-index:5;left:max(16px,env(safe-area-inset-left));bottom:110px;display:flex;flex-direction:column;gap:7px;pointer-events:auto}.chip{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.57);backdrop-filter:blur(12px);border-radius:999px;padding:7px 10px 7px 8px;font-size:11px;font-weight:700;color:#315249;box-shadow:0 5px 20px rgba(28,72,61,.08)}.chip i{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:rgba(82,151,134,.13);font-style:normal}
    .loading{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#dff4ee;transition:.6s opacity}.loading.done{opacity:0;pointer-events:none}.loader{text-align:center}.loader .orb{width:52px;height:52px;margin:auto;border-radius:50%;border:2px solid rgba(36,98,84,.12);border-top-color:#4d9584;animation:spin 1s linear infinite}.loader p{font-size:12px;color:#557069;margin-top:12px}@keyframes spin{to{transform:rotate(1turn)}}
    @media (max-width:680px){.panel{top:auto;right:12px;left:12px;bottom:102px;width:auto;transform:translateY(calc(100% + 130px));padding:16px;border-radius:22px}.panel.open{transform:translateY(0)}.panel h2{font-size:25px}.desc{margin:10px 0 12px;line-height:1.65}.meta{display:none}.chips{left:12px;bottom:108px;flex-direction:row;max-width:calc(100vw - 24px);overflow:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:none}.hint{top:21%}.bottom{padding-bottom:15px}}
  </style>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
  <div id="app"><div id="scene"></div></div>
  <div class="grain"></div>
  <div class="loading" id="loading"><div class="loader"><div class="orb"></div><p>小さな海を準備しています…</p></div></div>
  <div class="topbar"><div class="brand"><div class="eyebrow">Interactive coastal diorama</div><h1>Tiny Tide</h1></div><div class="top-actions"><button class="icon-btn" id="homeBtn" aria-label="全体を見る">⌂</button></div></div>
  <div class="hint" id="hint">指で回す・つまんでズーム・生き物をタップ</div>
  <aside class="panel" id="panel"><div class="panel-head"><div><span class="tag"><span class="dot"></span><span id="category">生き物</span></span><h2 id="name">マダコ</h2><p class="latin" id="latin">Octopus sinensis</p></div><button class="close" id="closeBtn">×</button></div><p class="desc" id="desc"></p><div class="meta"><div><b>見つかる場所</b><span id="habitat"></span></div><div><b>いまの様子</b><span id="behavior"></span></div></div></aside>
  <div class="chips" id="chips"></div>
  <section class="bottom"><div class="bottom-row"><div class="bottom-title">潮の満ち引き</div><div class="tide-value" id="tideText">潮位 45%</div></div><div class="range-wrap"><input id="tide" type="range" min="0" max="100" value="45" /></div></section>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    const host=document.getElementById('scene'),scene=new THREE.Scene();scene.background=new THREE.Color(0xdff4ee);scene.fog=new THREE.FogExp2(0xdff4ee,.024);
    const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(9.5,8.1,11.5);
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;host.appendChild(renderer.domElement);
    const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.055;controls.minDistance=6.3;controls.maxDistance=20;controls.maxPolarAngle=Math.PI*.48;controls.minPolarAngle=Math.PI*.18;controls.target.set(0,.5,0);controls.enablePan=false;
    scene.add(new THREE.HemisphereLight(0xf6fffc,0x6c7362,2.6));const sun=new THREE.DirectionalLight(0xfff0d2,4.2);sun.position.set(-6,12,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-10;sun.shadow.camera.right=10;sun.shadow.camera.top=10;sun.shadow.camera.bottom=-10;scene.add(sun);
    const world=new THREE.Group();scene.add(world);const clickable=[],creatureMap=new Map();const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0});
    function mesh(g,m,p=[0,0,0],r=[0,0,0],s=[1,1,1],shadow=true){const o=new THREE.Mesh(g,m);o.position.set(...p);o.rotation.set(...r);o.scale.set(...s);o.castShadow=shadow;o.receiveShadow=true;world.add(o);return o}
    mesh(new THREE.CylinderGeometry(4.5,5.05,.7,12),mat(0x856a4c),[0,-.65,0],[0,.03,0],[1,1,.82]);
    mesh(new THREE.CylinderGeometry(4.1,4.55,.62,11),mat(0x9a8159),[0,-.18,0],[0,-.02,0],[1,1,.82]);
    mesh(new THREE.CylinderGeometry(3.62,4.15,.52,11),mat(0x708f5a),[.15,.05,-.15],[0,.03,0],[1,1,.82]);
    mesh(new THREE.CylinderGeometry(2.4,3.25,.5,10),mat(0x7f9c62),[-.55,.48,-.35],[0,-.2,0],[1,1,.75]);
    const waterMat=new THREE.MeshStandardMaterial({color:0x54a8a1,roughness:.18,metalness:.03,transparent:true,opacity:.68});const water=new THREE.Mesh(new THREE.CircleGeometry(5.7,72),waterMat);water.rotation.x=-Math.PI/2;water.position.y=-.23;water.scale.set(1,.88,1);world.add(water);
    const poolMat=waterMat.clone();poolMat.color.set(0x4b9e97);poolMat.opacity=.78;const pool1=mesh(new THREE.CircleGeometry(1.2,40),poolMat,[1.7,.49,-.65],[-Math.PI/2,0,0],[1,.65,1],false),pool2=mesh(new THREE.CircleGeometry(.92,36),poolMat,[-1.65,.78,-.35],[-Math.PI/2,0,0],[1,.7,1],false);
    const stone=mat(0x7c766a),darkStone=mat(0x625f56);[[-3.6,.25,1.9,1.2],[-3.25,.18,-2.4,.9],[3.45,.08,-2.35,1.25],[3.62,.04,1.55,.95],[2.15,.8,2.55,.72],[-1.75,.9,2.8,.82],[-.15,1.04,-2.6,.65]].forEach((q,i)=>mesh(new THREE.DodecahedronGeometry(q[3],0),i%2?stone:darkStone,[q[0],q[1],q[2]],[.13*i,.25*i,.07*i],[1,.7,.95]));
    const green=mat(0x4f7c4e),green2=mat(0x678c55);function plant(x,z,scale=1){const g=new THREE.Group();g.position.set(x,.55,z);g.scale.setScalar(scale);for(let i=0;i<5;i++){const stem=new THREE.Mesh(new THREE.CapsuleGeometry(.055,.75,4,8),i%2?green:green2);stem.position.set((i-2)*.12,.35,0);stem.rotation.z=(i-2)*-.15;stem.rotation.x=(i%2?.12:-.14);stem.castShadow=true;g.add(stem)}world.add(g)}[[-2.5,-1.2,.8],[-2.25,-1.65,.6],[.05,2.25,.7],[.5,2.45,.55],[2.8,.6,.75],[2.55,1.1,.55],[-.8,-1.7,.6]].forEach(p=>plant(...p));
    function register(group,data){group.userData.creature=data;group.traverse(o=>{if(o.isMesh){o.userData.root=group;clickable.push(o)}});creatureMap.set(data.id,group);world.add(group);return group}
    const creatureData={octopus:{id:'octopus',emoji:'🐙',name:'マダコ',latin:'Octopus sinensis',category:'岩礁の住人',desc:'岩のすき間を好む、好奇心旺盛な海のハンター。潮が高くなると少し活発になり、腕をゆっくり広げます。',habitat:'岩場・浅い海',behavior:'岩陰を探索中'},crab:{id:'crab',emoji:'🦀',name:'イソガニ',latin:'Hemigrapsus sanguineus',category:'潮だまりの住人',desc:'波打ち際の石の下をすばやく歩く小さなカニ。干潮になると潮だまりの周りで姿を見つけやすくなります。',habitat:'潮だまり',behavior:'横歩きで移動中'},turtle:{id:'turtle',emoji:'🐢',name:'アオウミガメ',latin:'Chelonia mydas',category:'海の旅人',desc:'ゆったりと泳ぎながら浅瀬へやってきた海の旅人。満潮に近づくほど島の近くまで寄ってきます。',habitat:'島の外周',behavior:'ゆっくり遊泳中'},fish:{id:'fish',emoji:'🐟',name:'ルリスズメダイ',latin:'Chrysiptera cyanea',category:'浅瀬の魚',desc:'青く輝く小さな魚。潮が満ちると浅瀬に入り、群れで岩の間を行き来します。',habitat:'浅瀬・岩の周り',behavior:'群れで回遊中'}};
    function octopus(){const g=new THREE.Group();g.position.set(3,.48,1.05);const body=new THREE.Mesh(new THREE.SphereGeometry(.42,20,14),mat(0xb86762,.7));body.scale.set(.9,1,.82);body.castShadow=true;g.add(body);for(let i=0;i<8;i++){const a=i/8*Math.PI*2,t=new THREE.Mesh(new THREE.CapsuleGeometry(.055,.52,5,8),mat(0xa95755,.75));t.position.set(Math.cos(a)*.35,-.17,Math.sin(a)*.35);t.rotation.z=Math.PI/2;t.rotation.y=-a;t.rotation.x=.22*Math.sin(a*2);t.castShadow=true;g.add(t)}return register(g,creatureData.octopus)}
    function crab(){const g=new THREE.Group();g.position.set(-2.45,.87,.7);const m=mat(0xd46f50,.75),body=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12),m);body.scale.set(1.35,.55,1);g.add(body);for(const side of[-1,1])for(let i=0;i<3;i++){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.035,.35,3,6),m);leg.position.set(side*(.34+.06*i),-.05,(i-1)*.16);leg.rotation.z=side*(.9+.12*i);g.add(leg)}for(const side of[-1,1]){const claw=new THREE.Mesh(new THREE.SphereGeometry(.11,12,8),m);claw.position.set(side*.48,.04,.23);claw.scale.set(1.3,.7,1);g.add(claw)}g.traverse(o=>o.castShadow=true);return register(g,creatureData.crab)}
    function turtle(){const g=new THREE.Group();g.position.set(-3.55,-.05,-1.3);g.rotation.y=.55;const shell=new THREE.Mesh(new THREE.SphereGeometry(.38,18,12),mat(0x5f7953,.55));shell.scale.set(1.3,.45,1);g.add(shell);const skin=mat(0x73906d,.7),head=new THREE.Mesh(new THREE.SphereGeometry(.16,14,10),skin);head.position.x=.48;g.add(head);[[.17,.36],[.17,-.36],[-.16,.35],[-.16,-.35]].forEach(([x,z])=>{const f=new THREE.Mesh(new THREE.SphereGeometry(.15,10,8),skin);f.position.set(x,-.03,z);f.scale.set(1.6,.28,.55);f.rotation.y=z>0?.45:-.45;g.add(f)});g.traverse(o=>o.castShadow=true);return register(g,creatureData.turtle)}
    function fishSchool(){const g=new THREE.Group();g.position.set(.6,.25,-2.9);for(let i=0;i<4;i++){const f=new THREE.Group();f.position.set(i*.28,(i%2)*.13,(i%2?-.18:.13));const body=new THREE.Mesh(new THREE.SphereGeometry(.14,14,10),mat(0x327fa0,.38));body.scale.set(1.65,.65,.7);f.add(body);const tail=new THREE.Mesh(new THREE.ConeGeometry(.12,.25,3),mat(0x2c7291,.45));tail.rotation.z=-Math.PI/2;tail.position.x=-.27;f.add(tail);f.scale.setScalar(i===0?1.15:.82);g.add(f)}g.traverse(o=>o.castShadow=true);return register(g,creatureData.fish)}
    const oct=octopus(),cr=crab(),tur=turtle(),fish=fishSchool();const pts=[];for(let i=0;i<90;i++)pts.push((Math.random()-.5)*13,Math.random()*4-1,(Math.random()-.5)*13);const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const particles=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffffff,size:.025,transparent:true,opacity:.34}));world.add(particles);
    const panel=document.getElementById('panel'),hint=document.getElementById('hint');let selected=null,camTween=null,tide=.45,firstInteraction=false;
    function uiFor(data){document.getElementById('category').textContent=data.category;document.getElementById('name').textContent=data.name;document.getElementById('latin').textContent=data.latin;document.getElementById('desc').textContent=data.desc;document.getElementById('habitat').textContent=data.habitat;document.getElementById('behavior').textContent=data.behavior;panel.classList.add('open')}
    function focusCreature(id){const g=creatureMap.get(id);if(!g)return;selected=g;uiFor(g.userData.creature);const p=new THREE.Vector3();g.getWorldPosition(p);const dir=new THREE.Vector3().subVectors(camera.position,controls.target).normalize(),targetCam=p.clone().add(dir.multiplyScalar(5.7)).add(new THREE.Vector3(0,1.25,0));camTween={t:0,fromPos:camera.position.clone(),toPos:targetCam,fromTarget:controls.target.clone(),toTarget:p.clone().add(new THREE.Vector3(0,.15,0))};hint.classList.add('hide')}
    function home(){selected=null;panel.classList.remove('open');camTween={t:0,fromPos:camera.position.clone(),toPos:new THREE.Vector3(9.5,8.1,11.5),fromTarget:controls.target.clone(),toTarget:new THREE.Vector3(0,.5,0)}}document.getElementById('closeBtn').onclick=()=>{panel.classList.remove('open');selected=null};document.getElementById('homeBtn').onclick=home;
    const chips=document.getElementById('chips');Object.values(creatureData).forEach(d=>{const b=document.createElement('button');b.className='chip';b.innerHTML=`<i>${d.emoji}</i>${d.name}`;b.onclick=()=>focusCreature(d.id);chips.appendChild(b)});
    const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down={x:0,y:0};renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};if(!firstInteraction){firstInteraction=true;hint.classList.add('hide')}});renderer.domElement.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>10)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(clickable,false)[0];if(hit?.object.userData.root)focusCreature(hit.object.userData.root.userData.creature.id)});
    const tideSlider=document.getElementById('tide');function setTide(v){tide=v/100;tideSlider.style.setProperty('--v',v+'%');document.getElementById('tideText').textContent=`潮位 ${v}%`;const y=-.52+tide*.64;water.position.y=y;pool1.position.y=.37+tide*.26;pool2.position.y=.66+tide*.24;waterMat.opacity=.48+tide*.28;poolMat.opacity=.63+tide*.2}tideSlider.addEventListener('input',e=>setTide(+e.target.value));setTide(45);
    function ease(t){return 1-Math.pow(1-t,3)}const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.033);controls.update();if(camTween){camTween.t=Math.min(1,camTween.t+dt*1.9);const k=ease(camTween.t);camera.position.lerpVectors(camTween.fromPos,camTween.toPos,k);controls.target.lerpVectors(camTween.fromTarget,camTween.toTarget,k);if(camTween.t>=1)camTween=null}water.material.opacity=.53+tide*.2+Math.sin(t*1.2)*.018;water.rotation.z=Math.sin(t*.22)*.01;oct.rotation.y=Math.sin(t*.55)*.08;oct.children.slice(1).forEach((x,i)=>x.rotation.x=.18*Math.sin(t*1.5+i*.8));cr.position.x=-2.45+Math.sin(t*.7)*.16;cr.rotation.y=Math.sin(t*.9)*.16;tur.position.x=-3.55+Math.sin(t*.18)*.6*tide;tur.position.z=-1.3+Math.cos(t*.2)*.35;tur.rotation.y=.55+Math.sin(t*.21)*.3;fish.rotation.y=t*.35;fish.children.forEach((f,i)=>f.position.y=(i%2)*.13+Math.sin(t*2+i)*.05);fish.visible=tide>.22;particles.rotation.y=t*.018;renderer.render(scene,camera)}animate();
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});setTimeout(()=>document.getElementById('loading').classList.add('done'),650);
  </script>
